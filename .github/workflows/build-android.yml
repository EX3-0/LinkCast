name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone/**"
      - "tvhost/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "phone/**"
      - "tvhost/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build phone and TV host APKs
        run: ./gradlew --no-daemon :phone:assembleDebug :tvhost:assembleDebug

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist
          cp phone/build/outputs/apk/debug/phone-debug.apk dist/LinkCast-phone-debug.apk
          cp tvhost/build/outputs/apk/debug/tvhost-debug.apk dist/LinkCast-tvhost-debug.apk
          cp userscript/linkcast-tv.user.js dist/linkcast-tv.user.js
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload APKs and userscript
        uses: actions/upload-artifact@v4
        with:
          name: linkcast-debug-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
